name: Accessibility

on:
  pull_request:
  push:
    branches: [main]

jobs:
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Serve build output
        run: npx serve dist -p 4173 &

      - name: Wait for server
        run: npx wait-on http://localhost:4173

      - name: Run axe accessibility scan
        run: npx axe http://localhost:4173 --exit
